# This small file tells Python how to install the project.
# Without it we could not run "python -m prsentinel.diff_extractor".

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prsentinel"
version = "0.1.0"
description = "AI tool that reads a code change and generates tests for it"
requires-python = ">=3.10"
dependencies = [
    "groq",
    "google-genai",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

# The demo app serves one HTML file from inside the package. Without this the
# page would be missing from a real install and only work from an editable one,
# which is the kind of thing that works for the person who wrote it and nobody
# else.
[tool.setuptools.package-data]
prsentinel = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
